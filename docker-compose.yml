version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: table-order-db
    restart: unless-stopped
    ports:
      - '0.0.0.0:5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: table_order
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
